kind = "web"
previewPath = "/"
title = "BendBites"
description = "BendBites is a mobile-first weekly grocery planner for families balancing nutrition and budget. Compare preference-aware meal plans and grocery costs for a convenient single-store shop or a lower-cost route across nearby stores."
version = "1.0.0"
id = "artifacts/family-grocery"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18887

[services.development]
run = "pnpm --filter @workspace/family-grocery run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/family-grocery", "run", "build" ]
serve = "static"
publicDir = "artifacts/family-grocery/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18887"
BASE_PATH = "/"
